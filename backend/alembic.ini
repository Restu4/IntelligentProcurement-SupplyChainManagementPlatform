[alembic]
script_location = alembic
# Overridden by alembic/env.py with settings.DATABASE_URL (env/.env).
# Kept only as a fallback for tooling that reads the ini directly.
sqlalchemy.url = sqlite+aiosqlite:///./smartprocure.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
