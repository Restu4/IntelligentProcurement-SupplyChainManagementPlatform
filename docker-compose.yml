services:
  backend:
    build:
      context: ./backend
    image: smartprocure-ai-backend:local
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/smartprocure.db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-secure-random-secret-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CHROMA_PERSIST_DIR: /data/vectordb
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: smartprocure-ai-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Optional PostgreSQL for production-like runs:
  #   docker compose --profile postgres up --build
  # Then set DATABASE_URL=postgresql+asyncpg://smartprocure:smartprocure@db:5432/smartprocure
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartprocure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartprocure}
      POSTGRES_DB: ${POSTGRES_DB:-smartprocure}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  backend_data:
  postgres_data:
