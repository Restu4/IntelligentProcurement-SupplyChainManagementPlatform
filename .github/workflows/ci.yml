name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile
        run: python -m compileall -q app main.py seed.py seed_knowledge_base.py

      - name: Verify migrations
        run: |
          export DATABASE_URL=sqlite+aiosqlite:///./_ci_migration.db
          python -m alembic upgrade head
          python -m alembic check
        env:
          DATABASE_URL: sqlite+aiosqlite:///./_ci_migration.db

      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

  # The backend image installs torch/sentence-transformers and takes several
  # minutes to build, so it is built manually before a release:
  #   docker compose build
